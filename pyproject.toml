[project]
name = "python-yaml-lines-path"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gitpython>=3.1.45",
    "ruamel-yaml>=0.18.14",
]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "--cov-config=.coveragerc --cov=src --cov-report=xml tests"

[tool.ruff]
# Allow lines to be as long as 120.
line-length = 160
